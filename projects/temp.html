<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nikhil Lather - Profile Card</title>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "Segoe UI", sans-serif;
      }

      body {
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
      }

      .card {
        width: 360px;
        background: rgba(255, 255, 255, 0.12);
        backdrop-filter: blur(20px);
        border: 1px solid rgba(255, 255, 255, 0.2);
        border-radius: 25px;
        padding: 30px;
        text-align: center;
        color: white;
        box-shadow: 0 15px 40px rgba(0, 0, 0, 0.4);
        transition: 0.4s;
      }

      .card:hover {
        transform: translateY(-10px);
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
      }

      .profile-img {
        width: 120px;
        height: 120px;
        border-radius: 50%;
        background: linear-gradient(135deg, #00c6ff, #0072ff);
        display: flex;
        justify-content: center;
        align-items: center;
        font-size: 50px;
        font-weight: bold;
        margin: auto;
        border: 5px solid rgba(255, 255, 255, 0.3);
      }

      h2 {
        margin-top: 20px;
        margin-bottom: 10px;
        font-size: 30px;
      }

      .designation {
        color: #ffd54f;
        font-size: 18px;
        margin-bottom: 25px;
      }

      .info {
        text-align: left;
        margin-top: 10px;
      }

      .info p {
        margin: 15px 0;
        font-size: 17px;
        padding: 10px;
        background: rgba(255, 255, 255, 0.08);
        border-radius: 10px;
      }

      .buttons {
        display: flex;
        justify-content: center;
        gap: 15px;
        margin-top: 25px;
      }

      button {
        padding: 12px 22px;
        border: none;
        border-radius: 30px;
        cursor: pointer;
        color: white;
        font-size: 16px;
        transition: 0.3s;
      }

      .follow {
        background: #00c853;
      }

      .message {
        background: #ff9800;
      }

      button:hover {
        transform: scale(1.08);
      }

      .footer {
        margin-top: 25px;
        color: #ddd;
        font-size: 14px;
      }
    </style>
  </head>

  <body>
    <div class="card">
      <div class="profile-img">NL</div>

      <h2>Nikhil Lather</h2>

      <p class="designation">B.Tech CSE Student</p>

      <div class="info">
        <p>
          <strong>🎓 Course:</strong> B.Tech (Computer Science & Engineering)
        </p>

        <p><strong>🏫 College:</strong> Maharshi Dayanand University</p>

        <p><strong>📍 City:</strong> Bahadurgarh</p>

        <p><strong>📱 Mobile:</strong> 8168530783</p>
      </div>

      <div class="buttons">
        <button class="follow">Follow</button>

        <button class="message">Message</button>
      </div>
    </div>
  </body>
</html>
