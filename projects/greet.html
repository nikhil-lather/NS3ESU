<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Function Project</title>
  </head>
  <body>
     <script>
      function greet(name) {
        return "Hello, " + name + "!";
      }

      // Example usage:
      const userName = prompt("Enter your name:");
      const greetingMessage = greet(userName);
      alert(greetingMessage);
    </script> 
    
    </script> 
  </body>
